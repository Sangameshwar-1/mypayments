<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Payments</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>My Payments</h1><p>Payment & repayment tracker</p></header>
  <main>
    <section class="summary">
      <div class="card"><span>Total Taken</span><strong id="totalTaken">₹0</strong></div>
      <div class="card"><span>Total Repaid</span><strong id="totalRepaid">₹0</strong></div>
      <div class="card"><span>Outstanding</span><strong id="totalOutstanding">₹0</strong></div>
    </section>

    <section class="box">
      <h2>Add Person</h2>
      <div class="row"><input id="personName" placeholder="Person name"><button id="addPersonBtn">Add Person</button></div>
    </section>

    <section class="box">
      <h2>People</h2>
      <div id="peopleList">Loading...</div>
    </section>

    <section class="box">
      <h2>Add Transaction</h2>
      <form id="transactionForm">
        <label>Person</label><select id="transactionPerson" required><option value="">Select person</option></select>
        <label>Date</label><input type="date" id="transactionDate" required>
        <label>Type</label><select id="transactionType"><option value="taken">Taken</option><option value="repaid">Repaid</option></select>
        <label>Amount</label><input type="number" id="amount" min="0" step="0.01" required placeholder="Amount">
        <label>Charge</label><input type="number" id="charge" min="0" step="0.01" value="0" placeholder="Extra charge">
        <label>Payment Method</label><select id="method"><option>PhonePe</option><option>Google Pay</option><option>Amazon Pay</option><option>Cash</option><option>General</option><option>Other</option></select>
        <label>Description</label><input id="description" placeholder="Description">
        <button type="submit">Add Transaction</button>
      </form>
    </section>

    <section class="box">
      <div class="section-header"><h2>Transactions</h2><select id="filterPerson"><option value="all">All people</option></select></div>
      <div id="transactionsList">No transactions</div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
