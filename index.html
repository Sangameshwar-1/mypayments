<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Payments</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>My Payments</h1><p>Simple personal payment ledger</p></header>
  <main>
    <section class="summary">
      <div class="card"><span>Received</span><strong id="totalTaken" class="taken-text">₹0</strong></div>
      <div class="card"><span>Repaid</span><strong id="totalRepaid" class="repaid-text">₹0</strong></div>
      <div class="card"><span>Outstanding</span><strong id="totalOutstanding">₹0</strong></div>
    </section>

    <section class="box">
      <h2>Add Person</h2>
      <div class="row"><input id="personName" placeholder="Person name"><button id="addPersonBtn">Add Person</button></div>
    </section>

    <section class="box">
      <h2>Add Transaction</h2>
      <form id="transactionForm">
        <label>Person</label><select id="transactionPerson" required><option value="">Select person</option></select>
        <label>Date</label><input type="date" id="transactionDate" required>
        <label>Type</label><select id="transactionType"><option value="taken">Received</option><option value="repaid">Repaid</option></select>
        <label>Payment Method</label><select id="method"><option value="PhonePe">PhonePe</option><option value="Google Pay">Google Pay</option><option value="Amazon Pay">Amazon Pay</option><option value="Cash">Cash</option><option value="General">General</option><option value="Other">Other</option></select>
        <label>Amount</label><input type="number" id="amount" min="0" step="0.01" required placeholder="Amount">

        <div class="fee-options">
          <label>Charge mode</label>
          <select id="chargeMode">
            <option value="none">No automatic charge</option>
            <option value="fixed">Fixed charge</option>
            <option value="percent">Percentage charge</option>
            <option value="both">Percentage + fixed extra</option>
          </select>
          <label id="chargeRateLabel">Charge %</label>
          <input type="number" id="chargeRate" min="0" step="0.01" value="0" placeholder="e.g. 1.18">
          <label id="fixedChargeLabel">Fixed extra charge</label>
          <input type="number" id="fixedCharge" min="0" step="0.01" value="0" placeholder="e.g. 30">
          <label class="checkbox-row"><input type="checkbox" id="amountIncludesRate"> Amount already includes percentage charge</label>
          <div id="chargePreview" class="charge-preview">Total: ₹0</div>
        </div>

        <label>Description</label><input id="description" placeholder="e.g. PhonePe / taken / general">
        <button type="submit">Add Transaction</button>
      </form>
    </section>

    <section class="box">
      <div class="section-header"><h2>People</h2></div>
      <div id="peopleList">Loading...</div>
    </section>

    <section class="box">
      <div class="section-header"><h2>Person-wise Ledger</h2><select id="filterPerson"><option value="all">All people</option></select></div>
      <div id="transactionsList">No transactions</div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
